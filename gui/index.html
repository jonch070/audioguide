<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioGuide - Spectral Reconstruction GUI</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 AudioGuide</h1>
            <p class="subtitle">Spectral Reconstruction Synthesis</p>
        </header>

        <main>
            <!-- Project Setup Section -->
            <section class="card" id="project-section">
                <h2>Project Setup</h2>
                <div class="form-group">
                    <label for="project-name">Project Name:</label>
                    <input type="text" id="project-name" placeholder="My Spectral Project">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="target-file">Target Audio:</label>
                        <input type="file" id="target-file" accept="audio/*">
                        <span class="file-info" id="target-info">No file selected</span>
                    </div>
                    <div class="form-group">
                        <label for="corpus-dir">Corpus Directory:</label>
                        <input type="file" id="corpus-dir" webkitdirectory directory>
                        <span class="file-info" id="corpus-info">No directory selected</span>
                    </div>
                </div>
            </section>

            <!-- Spectral Reconstruction Settings -->
            <section class="card" id="spectral-section">
                <h2>Spectral Reconstruction Settings</h2>
                <div class="toggle-group">
                    <label class="toggle">
                        <input type="checkbox" id="use-spectral">
                        <span class="slider"></span>
                        <span class="label">Enable Spectral Reconstruction</span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label class="toggle">
                        <input type="checkbox" id="whole-file">
                        <span class="slider"></span>
                        <span class="label">Whole-File Analysis (for sustained notes/chords)</span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label class="toggle">
                        <input type="checkbox" id="volume-automation">
                        <span class="slider"></span>
                        <span class="label">Track-Level Volume Automation (VOLENV)</span>
                    </label>
                </div>

                <div class="slider-group">
                    <label for="max-partials">Max Partials: <span id="partials-value">8</span></label>
                    <input type="range" id="max-partials" min="1" max="32" value="8" class="slider-input">
                </div>

                <div class="slider-group">
                    <label for="tolerance-cents">Frequency Tolerance (cents): <span id="tolerance-value">50</span></label>
                    <input type="range" id="tolerance-cents" min="10" max="200" value="50" step="10" class="slider-input">
                </div>

                <div class="slider-group">
                    <label for="min-amplitude">Min Amplitude Ratio: <span id="amplitude-value">0.01</span></label>
                    <input type="range" id="min-amplitude" min="0.001" max="0.1" value="0.01" step="0.001" class="slider-input">
                </div>
            </section>

            <!-- Output Settings -->
            <section class="card" id="output-section">
                <h2>Output Settings</h2>
                <div class="form-group">
                    <label>Output Format:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="output" value="rpp" checked> Reaper Project (.rpp)</label>
                        <label><input type="radio" name="output" value="aaf"> AAF (Logic/Pro Tools)</label>
                        <label><input type="radio" name="output" value="csound"> Csound Score</label>
                        <label><input type="radio" name="output" value="json"> JSON</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="output-name">Output Name:</label>
                    <input type="text" id="output-name" placeholder="spectral_output">
                </div>
            </section>

            <!-- Templates -->
            <section class="card" id="templates-section">
                <h2>Quick Templates</h2>
                <div class="template-grid">
                    <button class="template-btn" data-template="single-note">
                        🎼 Single Note
                    </button>
                    <button class="template-btn" data-template="melody">
                        🎵 Monophonic Melody
                    </button>
                    <button class="template-btn" data-template="chord">
                        🎹 Chord/Polyphonic
                    </button>
                    <button class="template-btn" data-template="custom">
                        ⚙️ Custom
                    </button>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions">
                <button id="validate-btn" class="btn btn-secondary">🔍 Validate Settings</button>
                <button id="run-btn" class="btn btn-primary">▶️ Run AudioGuide</button>
                <button id="save-btn" class="btn btn-secondary">💾 Save Project</button>
                <button id="load-btn" class="btn btn-secondary">📁 Load Project</button>
            </section>

            <!-- Progress Section -->
            <section class="card hidden" id="progress-section">
                <h2>Processing</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="status-text" id="status-text">Initializing...</div>
                <div class="log-output" id="log-output"></div>
            </section>

            <!-- Results Section -->
            <section class="card hidden" id="results-section">
                <h2>Results</h2>
                <div class="results-info" id="results-info"></div>
                <div class="download-section" id="download-section"></div>
                <button id="new-project-btn" class="btn btn-primary">🆕 New Project</button>
            </section>
        </main>
    </div>

    <script src="static/js/main.js"></script>
</body>
</html>
